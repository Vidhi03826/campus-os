# =========================================================
# CAMPUSOS - DOCKER PROFILE
# =========================================================

spring.application.name=campus-os

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://mysql:3306/campus_os_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# =========================================================
# FILE STORAGE
# =========================================================

app.storage.resume-dir=${APP_STORAGE_RESUME_DIR:/app/uploads/resumes}

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =========================================================
# SERVER
# =========================================================

server.port=8080