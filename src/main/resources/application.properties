spring.application.name=campus-os

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campus_os_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# =========================================================
# FILE STORAGE
# =========================================================

app.storage.resume-dir=${APP_STORAGE_RESUME_DIR:uploads/resumes}

# =========================================================
# SERVER
# =========================================================

server.port=${SERVER_PORT:8082}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# =========================================================
# CACHE
# =========================================================

spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# =========================================================
# CORS
# =========================================================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# =========================================================
# OPENAPI / SWAGGER
# =========================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

info.app.name=CampusOS
info.app.description=Campus Placement and Recruitment Platform
info.app.version=1.0.0